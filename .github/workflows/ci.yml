name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pyyaml pytest ruff mypy

      - name: Lint (ruff)
        run: uv run --python .venv/bin/python ruff check core/ agents/ integrations/ web/ tests/

      - name: Type check (mypy)
        run: uv run --python .venv/bin/python mypy core/ --ignore-missing-imports

      - name: Unit + integration + fast E2E tests
        run: uv run --python .venv/bin/python -m pytest -q -m "not docker_e2e"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      # Build every service exactly as docker-compose.yml defines them.
      # Compose builds dependencies (base) before dependents (web/code/web3),
      # and the `test` service is defined in compose too.
      - name: Build all runtime images (compose)
        run: docker compose build

      - name: Smoke-test the tiny E2E runtime image
        run: |
          docker image inspect redforge/test-runtime:latest >/dev/null
          docker run --rm redforge/test-runtime:latest /usr/local/bin/e2e_tool.py /tmp/nope || test $? -ne 0

      - name: Verify Semgrep version in code-runtime
        run: |
          docker run --rm redforge/code-runtime:latest semgrep --version | grep -q "1.95.0"

      - name: Real Docker E2E tests (semgrep + workspace mount + persistence)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pyyaml pytest
          uv run --python .venv/bin/python -m pytest -q -m docker_e2e
