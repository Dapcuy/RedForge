name: ffuf
domain: web
capabilities:
  - fuzzing
  - content-discovery
runtime:
  image: redforge/web-runtime
  entrypoint: ffuf
  version: 2.1.0
priority: 10
inputs:
  target: url
  wordlist:
    type: string
    description: Path to a wordlist file
  u:
    type: string
    description: Target URL with FUZZ placeholder (overrides target)
output:
  format: json
input_schema:
  wordlist:
    type: string
  u:
    type: string
  json:
    type: boolean
trust:
  verified: false
  source: ffuf/ffuf (official release)
