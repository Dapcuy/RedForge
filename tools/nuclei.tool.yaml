name: nuclei
domain: web
capabilities:
  - vulnerability-scanning
  - template-scanning
runtime:
  image: redforge/web-runtime
  entrypoint: nuclei
  version: 3.3.7
  flag_map:
    u: "-u"
    template: "-t"
    jsonl: "-jsonl"
    url: "-u"
    duc: "-duc"
    silent: "-silent"
    disable_update_check: "-duc"
priority: 20
inputs:
  target: url
  url:
    type: string
    description: Target URL (overrides target)
  template:
    type: string
    description: Path to a local nuclei template
  jsonl:
    type: boolean
    description: Emit JSONL output
output:
  format: jsonl
input_schema:
  url:
    type: string
  u:
    type: string
  template:
    type: string
  jsonl:
    type: boolean
  duc:
    type: boolean
  silent:
    type: boolean
trust:
  verified: false
  source: projectdiscovery/nuclei (official release)
