name: e2e-probe
domain: generic
capabilities:
  - workspace-probe
runtime:
  image: redforge/test-runtime:latest
  entrypoint: /usr/local/bin/e2e_tool.py
  version: 0.0.1
priority: 10
inputs:
  target: source-dir
  path:
    type: string
    required: true
    description: Path inside the workspace to read
output:
  format: json
input_schema:
  path:
    type: string
    required: true
trust:
  verified: true
  source: redforge-test
